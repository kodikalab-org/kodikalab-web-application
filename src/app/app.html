<div class="min-h-dvh overflow-clip bg-kl-bg text-kl-text">
  <div class="theme-bar" aria-label="Apariencia">
    <button type="button" class="theme-toggle" (click)="theme.toggle()"
      [attr.aria-pressed]="theme.current() === 'light'"
      [attr.aria-label]="theme.current() === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro'">
      {{ theme.current() === 'dark' ? 'Modo claro' : 'Modo oscuro' }}
    </button>
  </div>
  <router-outlet />
</div>
