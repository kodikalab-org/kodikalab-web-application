<div
  class="relative flex min-h-dvh flex-col overflow-hidden bg-kl-bg font-body text-kl-text"
  #pageStart
>
  <img
    class="pointer-events-none absolute inset-0 z-0 size-full object-cover object-top"
    src="images/login/bg.svg"
    alt=""
    aria-hidden="true"
  />

  <mat-toolbar
    class="auth-header relative z-10 gap-4 border-0 border-b border-solid border-kl-divider bg-kl-bg/80 px-4 font-body backdrop-blur-xl md:gap-6 md:px-10 xl:px-14"
    role="banner"
  >
    <a class="inline-flex items-center gap-2.5" routerLink="/" aria-label="Kodikalab, inicio">
      <img src="images/login/logo-40.svg" alt="" width="36" height="36" />
      <span class="text-[22px] font-medium tracking-[-.4px] md:text-2xl">Kodikalab</span>
    </a>

    <nav class="hidden items-center gap-8 pl-6 lg:flex" aria-label="Principal">
      <span
        class="cursor-default text-[15px] text-kl-inactive"
        aria-disabled="true"
        title="Próximamente"
        >Inicio</span
      >
      <a
        class="border-0 border-b-2 border-solid border-transparent py-[22px] text-[15px] text-kl-inactive transition-colors hover:text-kl-accent-text aria-[current=page]:border-kl-accent aria-[current=page]:text-kl-text"
        routerLink="/practicante/problemas-asignados"
        routerLinkActive=""
        ariaCurrentWhenActive="page"
        >Problemas</a
      >
      @for (enlace of enlaces; track enlace) {
        <span
          class="cursor-default text-[15px] text-kl-inactive"
          aria-disabled="true"
          title="Próximamente"
          >{{ enlace }}</span
        >
      }
    </nav>

    <div class="flex-1"></div>

    <form
      class="hidden w-full max-w-[340px] md:block"
      [formGroup]="form"
      role="search"
      novalidate
      (submit)="$event.preventDefault()"
    >
      <mat-form-field class="auth-field w-full text-sm" appearance="outline" subscriptSizing="dynamic">
        <img matPrefix src="images/app/search-muted.svg" alt="" width="18" height="18" />
        <input
          matInput
          type="search"
          formControlName="busqueda"
          placeholder="Buscar problemas, usuarios, concursos..."
          aria-label="Buscar problemas, usuarios y concursos"
          autocomplete="off"
        />
      </mat-form-field>
    </form>

    <div class="flex items-center gap-3">
      <button
        type="button"
        class="flex size-9 cursor-pointer items-center justify-center rounded-full border-0 bg-transparent p-0 hover:bg-white/8"
        aria-label="Notificaciones"
      >
        <img src="images/app/bell-body.svg" alt="" width="20" height="20" />
      </button>
      <button
        type="button"
        class="flex size-9 cursor-pointer items-center justify-center rounded-full border-0 bg-transparent p-0 hover:bg-white/8"
        aria-label="Cambiar tema"
      >
        <img src="images/app/moon-body.svg" alt="" width="20" height="20" />
      </button>
      <button
        type="button"
        class="flex cursor-pointer items-center gap-1.5 rounded-full border-0 bg-transparent p-0"
        aria-label="Menú de la cuenta"
      >
        <span
          class="flex size-9 items-center justify-center rounded-full bg-linear-to-b from-[#8a6cff] to-[#6e52f2] text-[13px] font-semibold"
          >MP</span
        >
        <img
          class="max-md:hidden"
          src="images/app/chevron-down-body.svg"
          alt=""
          width="18"
          height="18"
        />
      </button>
    </div>
  </mat-toolbar>

  <main class="relative z-10 flex-1">
    <router-outlet />
  </main>

  <footer
    class="relative z-10 border-0 border-t border-solid border-kl-divider bg-kl-bg/80 px-4 py-6 backdrop-blur-xl md:px-10 xl:px-14"
  >
    <div class="flex flex-wrap items-center justify-between gap-x-6 gap-y-3">
      <div class="flex items-center gap-3">
        <img src="images/landing/logo-footer-28.svg" alt="" width="28" height="28" />
        <span class="text-lg font-medium">Kodikalab</span>
        <span class="text-[13px] text-kl-muted max-md:hidden"
          >© 2026 Kodikalab. Todos los derechos reservados.</span
        >
      </div>
      <div class="flex items-center gap-6 text-[13px]">
        <span class="cursor-default text-kl-accent-link" aria-disabled="true" title="Próximamente"
          >Términos de Servicio</span
        >
        <span class="cursor-default text-kl-muted" aria-disabled="true" title="Próximamente"
          >Política de privacidad</span
        >
      </div>
    </div>
  </footer>
</div>
